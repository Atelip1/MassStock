<div class="toast-stack">
  <div class="toast" *ngFor="let t of toast.toasts()" [class.ok]="t.type === 'ok'" [class.err]="t.type === 'err'" [class.info]="t.type === 'info'">
    <svg *ngIf="t.type === 'ok'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <svg *ngIf="t.type === 'err'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span>{{ t.text }}</span>
    <button class="toast-close" (click)="toast.descartar(t.id)">&times;</button>
  </div>
</div>
